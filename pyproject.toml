[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cervical-screening"
version = "0.1.0"
description = "Trustworthy, resource-efficient vision transformers for cervical cytology screening"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
